name: Testing
on:
  workflow_call:
    inputs:
      python-versions:
        description: 'List of Python versions to use in matrix, as JSON string'
        required: true
        type: string
      os-versions:
        description: 'List of OS versions to use in matrix, as JSON string'
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  build-and-test:
    name: Testing using ${{ matrix.os }} with ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-versions) }}
        python-version: ${{ fromJson(inputs.python-versions) }}
        exclude:
          # numcodecs (via hdmf-zarr -> zarr) has no macOS cp314 wheel yet, and its
          # universal2 source build fails to link. Re-enable once wheels are published.
          - os: macos-latest
            python-version: "3.14"
    env:
      TESTING_FILES_FOLDER_PATH: ./204919/testing_files/
    steps:
      - uses: actions/checkout@v6
      - run: git fetch --prune --unshallow --tags

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: |
          pip install pytest
          pip install pytest-cov

      - name: Install package
        run: pip install ".[dandi,zarr]"
      - name: Download testing data and set config path
        run: dandi download "https://sandbox.dandiarchive.org/#/dandiset/204919"

      - name: Run pytest with coverage
        run: pytest -rsx --cov=nwbinspector --cov-report xml:./coverage.xml

      - if: ${{ matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest' }}
        name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}
          file: ./coverage.xml

  build-and-test-no-dandi:
    name: Testing using ${{ matrix.os }} with ${{ matrix.python-version }} without dandi dependencies
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      - run: git fetch --prune --unshallow --tags

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Install package
        run: pip install ".[zarr]"

      - name: Run pytest with coverage
        run: pytest -rsx

  test-without-hdmf-zarr:
    name: Verify install hint when hdmf-zarr is absent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install nwbinspector with hdmf-zarr to generate the fixture
        run: uv pip install --system ".[zarr]" pytest

      - name: Generate the Zarr fixture
        run: python tests/test_missing_hdmf_zarr.py

      - name: Uninstall hdmf-zarr
        run: uv pip uninstall --system hdmf-zarr

      - name: Run the missing-hdmf-zarr test
        run: pytest tests/test_missing_hdmf_zarr.py -v
